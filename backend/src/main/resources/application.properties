spring.application.name=script
server.address=127.0.0.1
server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
spring.jackson.deserialization.fail-on-unknown-properties=true
script.storage=${SCRIPT_STORAGE:local}
script.data-directory=${SCRIPT_DATA_DIRECTORY:.local/data}
script.aws.region=${AWS_REGION:us-west-2}
script.aws.table=${SCRIPT_DYNAMODB_TABLE:ScriptWorlds}
script.aws.bucket=${SCRIPT_S3_BUCKET:}
